name: Publish to npm

# Triggered by publishing a GitHub release whose tag is the package version,
# e.g. tag "v0.2.0" for "version": "0.2.0" in package.json.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Check release tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # Pre-releases (marked as such on GitHub) go to the "next" dist-tag
      - name: Publish
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
